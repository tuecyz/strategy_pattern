version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: payment-postgres

    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5430:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: